site_name: SecureSDP
site_description: Software-Defined Perimeter with a Bridge-model controller hierarchy and dynamic hardening (Go implementation)
site_url: https://antoniopaya22.github.io/Secure-SDP/
repo_url: https://github.com/antoniopaya22/Secure-SDP
repo_name: antoniopaya22/Secure-SDP
edit_uri: edit/main/docs/
copyright: Copyright &copy; Antonio Payá González and contributors

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/antoniopaya22

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Components:
      - Overview: components/index.md
      - Controller (sdp-controller): components/controller.md
      - Accepting host (sdp-services): components/services.md
      - Initiating host (sdp-client): components/client.md
      - Policy reference: components/policy.md
  - Dynamic hardening: hardening.md
  - Lab & demo: lab.md
  - Evaluation: evaluation.md
  - Research:
      - Paper: research.md
      - Research line: research-line.md
      - History and provenance: history.md
